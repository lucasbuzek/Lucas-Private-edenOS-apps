name: BIFROST Task 2 Native Host
on:
  pull_request:
    branches: [bifrost/reconcile-20261005]
    paths:
      - 'BIFROST/**'
      - '.github/workflows/bifrost-native-host.yml'
  push:
    branches: [bifrost/task2-native-host-20261005]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: BIFROST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned provider and packaging tools
        run: python -m pip install . build==1.3.0
      - name: Native effects security and MCP interoperability
        run: |
          python -m unittest discover -s tests -p 'test_native*.py' -v 2>&1 | tee native-tests.txt
          test ${PIPESTATUS[0]} -eq 0
      - name: Preserve and measure recovered RDC regression
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_remote_provider.py' -v > recovered-rdc-tests.txt 2>&1
      - name: Build wheel and source archive
        run: python -m build
      - name: Clean wheel install and verify
        run: |
          python -m venv clean-test
          clean-test/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/BIFROST/clean-test/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/BIFROST/tests" -p 'test_native*.py' -v
      - name: Check package manifest and checksum
        run: python scripts/package_evidence.py
      - name: Build Apple owner surface and bundled runtime
        if: runner.os == 'macOS'
        run: |
          python -m pip install pyinstaller==6.16.0
          python scripts/build_apple.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bifrost-native-host-${{ runner.os }}
          path: |
            BIFROST/dist/
            BIFROST/native-tests.txt
            BIFROST/recovered-rdc-tests.txt
            BIFROST/package-evidence.json
