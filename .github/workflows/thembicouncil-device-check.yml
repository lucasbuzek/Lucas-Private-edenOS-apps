name: THEMBIcouncil device agent (offline)
on:
  push:
    branches:
      - thembicouncil-product-site-20261108
    paths:
      - 'THEMBIcouncil/device-agent/**'
      - '.github/workflows/thembicouncil-device-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile endpoint
        run: python -m py_compile THEMBIcouncil/device-agent/thembicouncil_agent.py
      - name: Offline root and permission checks
        run: python -m unittest discover -s THEMBIcouncil/device-agent/tests -v
      - name: Validate Mac Linux installer syntax
        if: runner.os != 'Windows'
        run: sh -n THEMBIcouncil/device-agent/install-thembicouncil.sh
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'THEMBIcouncil/device-agent/Install-THEMBIcouncil.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
