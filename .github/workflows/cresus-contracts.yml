name: CRESUS Contract Verification
on:
  push:
    paths:
      - 'apps/cresus/**'
  pull_request:
    paths:
      - 'apps/cresus/**'
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cresus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
