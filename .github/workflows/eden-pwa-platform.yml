name: EDENOS PWA platform candidate

on:
  push:
    branches:
      - feat/universal-authenticated-pwa-platform
      - feat/universal-pwa-standalone-20261018
    paths:
      - "PWA_PLATFORM/**"
      - ".github/workflows/eden-pwa-platform.yml"
  pull_request:
    paths:
      - "PWA_PLATFORM/**"
      - ".github/workflows/eden-pwa-platform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install standalone package dependencies
        working-directory: PWA_PLATFORM
        run: npm ci --ignore-scripts
      - name: Test fail-closed manifest validation
        working-directory: PWA_PLATFORM
        run: npm test
      - name: Validate independent HERMES and CRESUS deployment profiles
        working-directory: PWA_PLATFORM
        run: npm run validate
