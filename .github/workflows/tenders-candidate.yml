name: TENDERS 0.1.3 candidate QA
on:
  push:
    branches: [candidate/tenders-0.1.3-recovery-20261029]
    paths: ['TENDERS/PWA/**', '.github/workflows/tenders-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TENDERS/PWA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: TENDERS/PWA/package-lock.json
      - name: Generate deterministic original PWA icons
        run: python3 scripts/generate_icons.py
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify output
        run: test -f dist/index.html && test -f dist/manifest.webmanifest && test -f dist/icons/tenders-512.png
      - name: Public official APIs read-only schema smoke (informational)
        continue-on-error: true
        run: node scripts/official_source_smoke.mjs
