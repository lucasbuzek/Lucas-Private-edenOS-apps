# BRAGI: self-hosted upstream Postiz runtime. No public ports, no paid services.
name: bragi-postiz
services:
  postiz:
    image: ${POSTIZ_IMAGE:?Pin an audited Postiz image tag}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4007:5000"
    environment:
      MAIN_URL: ${PUBLIC_URL:?}
      FRONTEND_URL: ${PUBLIC_URL:?}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL:?}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: postgresql://bragi:${POSTGRES_PASSWORD:?}@postgres:5432/bragi
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      RUN_CRON: "true"
      DISABLE_REGISTRATION: ${BRAGI_DISABLE_REGISTRATION:-true}
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    networks: [postiz-net, temporal-net]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bragi
      POSTGRES_USER: bragi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postiz-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bragi -d bragi"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [postiz-net]
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [postiz-net]
  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?}
    volumes: [temporal-db:/var/lib/postgresql/data]
    networks: [temporal-net]
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms256m -Xmx256m
      xpack.security.enabled: "false"
    volumes: [temporal-search:/usr/share/elasticsearch/data]
    networks: [temporal-net]
  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?}
      POSTGRES_SEEDS: temporal-postgres
      ENABLE_ES: "true"
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7
      TEMPORAL_NAMESPACE: default
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on: [temporal-postgres, temporal-elasticsearch]
    networks: [temporal-net]
volumes:
  postiz-config: {}
  postiz-uploads: {}
  postiz-db: {}
  redis-data: {}
  temporal-db: {}
  temporal-search: {}
networks:
  postiz-net: {internal: false}
  temporal-net: {internal: true}
