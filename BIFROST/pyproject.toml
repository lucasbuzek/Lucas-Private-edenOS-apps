[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-native-host"
version = "0.1.0"
description = "BIFROST-owned scoped local Native Host MCP provider"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "keyring==25.6.0; sys_platform == 'darwin'"]

[project.scripts]
bifrost-native-host = "bifrost.native_mcp:main"
bifrost-native-control = "bifrost.native_control:main"

[tool.setuptools.packages.find]
include = ["bifrost*"]
