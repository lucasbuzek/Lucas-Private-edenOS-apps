[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-chatgpt-apple"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai==2.54.0", "Authlib==1.8.0", "requests==2.34.2", "keyring==25.7.0", "mcp==1.30.0", "httpx==0.28.1"]

[project.scripts]
bifrost-chatgpt-provider = "bifrost.chatgpt_stdio:main"

[tool.setuptools.packages.find]
include = ["bifrost*"]
