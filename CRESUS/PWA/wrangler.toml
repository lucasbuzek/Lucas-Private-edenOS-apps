name = "cresus-agent"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Static PWA files (index.html, manifest, service worker, icons)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Free Workers AI (10,000 neurons/day on the free plan)
[ai]
binding = "AI"

# Users, chats, settings
[[d1_databases]]
binding = "DB"
database_name = "cresus-agent"
database_id = "deafac98-8efa-414b-9561-30904ac1f9b9"

[vars]
# You — always admin, can never be locked out by the app
OWNER_EMAIL = "lucasbuzek@gmail.com"
# Your Cloudflare Zero Trust team domain, e.g. "edenos.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = "REPLACE.cloudflareaccess.com"
# The Access application's "Application Audience (AUD) tag"
ACCESS_AUD = "REPLACE_WITH_AUD_TAG"
# Model provider: "workers-ai" (free, private) | "gemini" | "anthropic"
PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
GEMINI_MODEL = "gemini-2.5-flash"
ANTHROPIC_MODEL = "claude-sonnet-4-5"

# Optional secrets (set with `npx wrangler secret put NAME`):
#   GEMINI_API_KEY      – only if PROVIDER = "gemini"
#   ANTHROPIC_API_KEY   – only if PROVIDER = "anthropic"
#   CF_API_TOKEN        – lets the admin screen sync the Access allow-list
#   CF_ACCOUNT_ID, ACCESS_GROUP_ID – used with CF_API_TOKEN
