# Non-deployable template. Preserve existing CRESUS Worker, D1 and user data.
# Dedicated CRESUS gateway wrapper; NOT the application Worker itself.
name = "edenos-cresus-closed-test-CANDIDATE"
main = "./cresus.worker.mjs"
compatibility_date = "2026-10-18"
workers_dev = false

[[services]]
binding = "APP"
service = "cresus-agent"

[[d1_databases]]
binding = "GATE_DB"
database_name = "REPLACE_WITH_VERIFIED_EXISTING_CRESUS_DB"
database_id = "REPLACE_WITH_VERIFIED_EXISTING_CRESUS_DB_ID"

[vars]
PRIVATE_UPSTREAM_MODE = "service"
WAITLIST_STORE = "cresus-users"
PRIVATE_HOST = "REPLACE_WITH_CRESUS_PRIVATE_HOST"
WAITLIST_HOST = "REPLACE_WITH_CRESUS_PUBLIC_WAITLIST_HOST"
OWNER_EMAIL = "REPLACE_WITH_VERIFIED_OWNER_EMAIL"
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_VERIFIED_ACCESS_TEAM_DOMAIN"
ACCESS_AUD = "REPLACE_WITH_CRESUS_APPLICATION_AUDIENCE"
TURNSTILE_SITE_KEY = "REPLACE_WITH_CRESUS_PUBLIC_TURNSTILE_SITEKEY"
# TURNSTILE_SECRET is a Worker secret.
# CRESUS users table is reused for pending/active/disabled approval state.
# Existing cresus-agent direct workers.dev/custom domains MUST ALSO be protected
# or disabled, otherwise the gateway can be bypassed.
# Approvals still require physical Cloudflare Access-group policy acceptance.
