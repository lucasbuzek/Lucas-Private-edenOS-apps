name: SWAYcoreDanceFitness
options:
  bundleIdPrefix: com.lucasbuzek.private
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
configFiles:
  Debug: ../../Config/Signing.xcconfig
  Release: ../../Config/Signing.xcconfig
packages:
  SWAYcoreKit: { path: ../../Packages/SWAYcoreKit }
  SWAYAppKit: { path: ../../Packages/SWAYAppKit }
targets:
  SWAYcoreDanceFitness:
    type: application
    platform: iOS
    sources:
      - Sources
      - { path: ../../Assets/Characters, type: folder, buildPhase: resources }
    dependencies:
      - package: SWAYcoreKit
      - package: SWAYAppKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasbuzek.private.swaycore.danceandfitness
        PRODUCT_NAME: SWAYcoreDanceFitness
        PRODUCT_MODULE_NAME: SWAYcoreDanceFitness
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "SWAYcore Dance & Fitness"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "SWAY uses the camera on-device to see your movement for matching. Frames are never stored or sent anywhere unless you choose to record."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used only when you record yourself dancing."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Saves recordings you choose to keep."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Reads nothing today; reserved for workout summaries."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Saves your dance workouts to Health."
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Lets you dance to songs from Apple Music."
        CODE_SIGN_ENTITLEMENTS: SWAYcoreDanceFitness.entitlements
    scheme:
      testTargets: [SWAYcoreDanceFitnessTests]
  SWAYcoreDanceFitnessTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SWAYcoreDanceFitness
      - package: SWAYcoreKit
      - package: SWAYAppKit
    settings:
      base: { GENERATE_INFOPLIST_FILE: YES, SWIFT_VERSION: "5.9", BUNDLE_LOADER: "$(TEST_HOST)", TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SWAYcoreDanceFitness.app/SWAYcoreDanceFitness" }
